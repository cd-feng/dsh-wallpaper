name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check src/client.template.js
          python3 -m py_compile scripts/make-wallpapers.py

      - name: Behaviour tests
        run: npm test

      - name: Bundle is up to date
        if: matrix.node == 22
        run: |
          node scripts/build-client.mjs
          git diff --exit-code -- lib/client.js

      - name: Publishable file list
        if: matrix.node == 22
        run: npm pack --dry-run
